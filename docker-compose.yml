# ============================================================
# PCCA Portal — full stack
#   docker compose up -d
#
# Only the web container publishes a port. Postgres, the API and
# ClamAV are reachable only on the internal network.
# ============================================================
name: pcca-portal

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-pcca_portal}
      POSTGRES_USER: ${PGUSER:-pcca_app}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports: — the database is NEVER reachable from outside.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-pcca_app} -d ${PGDATABASE:-pcca_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    # Hardening
    read_only: false          # needs /app/uploads
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # One-shot. Migrations never run from application startup, so a
  # crash-looping app cannot half-apply a schema change.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
    command: sh -c "node src/db/migrate.js && node src/db/seed.js"
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"
      # - "443:443"          # enable once certificates are in place
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [api]
    networks: [internal]
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
  uploads:
  clamdb:

networks:
  internal:
    driver: bridge
