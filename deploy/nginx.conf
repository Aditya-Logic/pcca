# ============================================================
# PCCA Portal — Nginx
# pcca.mha.gov.in
#
# Nginx terminates TLS, serves the frontend as static files, and
# proxies /api/ to the Node process. The API is never exposed
# directly to the internet.
# ============================================================

# Redirect all plaintext traffic. No exceptions.
server {
    listen 80;
    listen [::]:80;
    server_name pcca.mha.gov.in;

    # Let's Encrypt / ACME challenge, if used
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pcca.mha.gov.in;

    # ---------- TLS ----------
    ssl_certificate     /etc/nginx/certs/pcca.mha.gov.in.crt;
    ssl_certificate_key /etc/nginx/certs/pcca.mha.gov.in.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # ---------- Security headers ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Never reveal the version
    server_tokens off;

    # ---------- Upload ceiling ----------
    # Must exceed MAX_UPLOAD_MB so the API produces the friendly
    # error rather than Nginx cutting the connection.
    client_max_body_size 30m;
    client_body_timeout 60s;

    # ---------- Rate limiting (second layer behind the app's own) ----------
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ---------- Static frontend ----------
    root /var/www/pcca;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|woff2|png|svg|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API ----------
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params_pcca;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params_pcca;

        # Uploads and downloads can be slow on a field connection
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Block anything that should never be served
    location ~ /\.(git|env|ht) { deny all; return 404; }
    location ~ ^/(uploads|node_modules|backend)/ { deny all; return 404; }
}
